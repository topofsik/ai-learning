<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제 제출 기록</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">AI LEARNING CREW</p><h1>과제 제출 기록</h1><p>오늘의 결과물 링크를 남겨 주세요.</p></div><span class="privacy">● 이 브라우저에 제출 기록 저장</span></header>
    <nav class="tabs" aria-label="화면 선택"><button class="tab active" data-tab="submit">과제 제출</button><button class="tab" data-tab="history">제출 현황</button><button class="tab" data-tab="members">회원 관리</button></nav>
    <section id="submit" class="view active-view"><div class="panel submit-card"><div class="section-head"><div><h2>과제 제출하기</h2><p>회원 이름과 날짜를 선택하고 결과물 링크를 입력하세요.</p></div><span class="today-label" id="todayLabel"></span></div><form id="submissionForm"><div class="form-grid"><label>회원 이름<select id="submitter" required><option value="">이름을 선택하세요</option></select></label><label>제출 날짜<input id="submissionDate" type="date" required></label></div><label>결과물 링크<input id="resultUrl" type="url" placeholder="https://..." required></label><label>간단한 메모 <span class="optional">선택</span><textarea id="submissionNote" rows="3" placeholder="무엇을 만들었는지 짧게 적어 주세요."></textarea></label><div class="action-row"><button class="primary" type="submit">제출 기록 남기기</button><span class="muted">같은 날짜에 다시 제출하면 기존 기록이 갱신됩니다.</span></div></form><div id="submitNotice" class="notice hidden" role="status"></div></div></section>
    <section id="history" class="view"><div class="panel controls"><label>조회 날짜<input id="historyDate" type="date"></label><button id="exportSubmissionsBtn" class="secondary">제출 기록 CSV</button></div><div class="summary-grid"><article class="metric"><span>전체 회원</span><strong id="totalCount">0</strong><small>명</small></article><article class="metric green"><span>제출</span><strong id="submittedCount">0</strong><small>명</small></article><article class="metric red"><span>미제출</span><strong id="missingCount">0</strong><small>명</small></article><article class="metric progress-card"><span>제출률 <b id="rateText">0%</b></span><div class="progress"><i id="progressBar"></i></div></article></div><div class="panel table-panel"><div class="section-head"><div><h2 id="historyTitle">제출 현황</h2><p id="historyDescription"></p></div><button id="copyMissingBtn" class="secondary">미제출자 복사</button></div><div class="table-wrap"><table><thead><tr><th>회원</th><th>상태</th><th>제출 시각</th><th>결과물</th><th>메모</th></tr></thead><tbody id="historyBody"></tbody></table></div></div><div class="panel"><div class="section-head"><div><h2>최근 제출 기록</h2><p>저장된 모든 제출 이력을 확인합니다.</p></div></div><div id="recentList" class="recent-list"></div></div></section>
    <section id="members" class="view"><div class="panel"><div class="section-head"><div><h2>회원 관리</h2><p>회원 이름과 카톡 별칭을 관리합니다. 변경 내용은 이 브라우저에 저장됩니다.</p></div><div class="member-actions"><button id="importMembersBtn" class="secondary">CSV 가져오기</button><input id="memberFileInput" type="file" accept=".csv,text/csv" hidden><button id="exportMembersBtn" class="secondary">명단 CSV 내보내기</button><button id="addMemberBtn" class="primary">+ 회원 추가</button></div></div><div id="memberList" class="member-list"></div></div></section>
  </main>
  <template id="memberTemplate"><div class="member-row"><input class="member-name" aria-label="이름"><input class="member-aliases" aria-label="별칭" placeholder="별칭1|별칭2"><button class="danger remove-member">삭제</button></div></template>
  <script type="module" src="app.js"></script>
</body>
</html>
